  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {

family<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 7. RSVP ============ -->\n<section id=\"rsvp\" class=\"wc-host\" style=\"background: #F3E3DF; padding: clamp(80px, 12vw, 128px) 20px\">\n  <div class=\"reveal\" style=\"max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 32px\">\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center\">\n      <p style=\"margin: 0; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #76594D\">Kindly reply by {{c.rsvpBy}}<\u002Fp>\n      <h2 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(36px, 7vw, 50px); line-height: 1.1\">Will you join us?<\u002Fh2>\n      <p style=\"margin: 0; font-family: 'Caveat', cursive; font-size: 23px; color: #9E5B48\">it simply won't feel complete without you<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{notSubmitted}}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{submit}}\" sc-camel-no-validate=\"{{ true }}\" style=\"width: 100%; background: #FFF9F2; border: 1px solid #E8C9C3; border-radius: 24px; padding: clamp(24px, 6vw, 40px); display: flex; flex-direction: column; gap: 22px\">\n        <div class=\"field\">\n          <label for=\"rsvp-name\">Your name<\u002Flabel>\n          <input id=\"rsvp-name\" type=\"text\" sc-camel-auto-complete=\"name\" value=\"{{form.name}}\" sc-camel-on-change=\"{{onName}}\" placeholder=\"e.g. Meera Sharma\">\n          <sc-if value=\"{{errors.name}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\" role=\"alert\">{{errors.name}}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px\">\n          <legend class=\"legend\" style=\"padding: 0; margin-bottom: 10px\">Will you be there?<\u002Flegend>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n            <label class=\"choice\"><input type=\"radio\" name=\"attend\" value=\"yes\" checked=\"{{attYes}}\" sc-camel-on-change=\"{{onAttend}}\"> Joyfully accepts<\u002Flabel>\n            <label class=\"choice\"><input type=\"radio\" name=\"attend\" value=\"no\" checked=\"{{attNo}}\" sc-camel-on-change=\"{{onAttend}}\"> Regretfully declines<\u002Flabel>\n          <\u002Fdiv>\n          <sc-if value=\"{{errors.attend}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\" role=\"alert\">{{errors.attend}}<\u002Fspan><\u002Fsc-if>\n        <\u002Ffieldset>\n        <sc-if value=\"{{attYes}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"field\">\n            <label for=\"rsvp-guests\">Number of guests (including you)<\u002Flabel>\n            <sc-raw-select id=\"rsvp-guests\" value=\"{{form.guests}}\" sc-camel-on-change=\"{{onGuests}}\">\n              <option value=\"1\">1<\u002Foption><option value=\"2\">2<\u002Foption><option value=\"3\">3<\u002Foption><option value=\"4\">4<\u002Foption><option value=\"5\">5<\u002Foption><option value=\"6\">6<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"field\">\n          <label for=\"rsvp-msg\">A little note for us (optional)<\u002Flabel>\n          <textarea id=\"rsvp-msg\" value=\"{{form.message}}\" sc-camel-on-change=\"{{onMessage}}\" placeholder=\"Wishes, song requests, dietary needs…\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <button type=\"submit\" class=\"btn\" style=\"align-self: center; margin-top: 4px\">Continue to WhatsApp<\u002Fbutton>\n        <p style=\"margin: -6px 0 0; text-align: center; font-size: 13px; line-height: 1.6; color: #76594D\">Your reply opens in WhatsApp, already written — just tap send.<\u002Fp>\n      <\u002Fform>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{submitted}}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" class=\"card-in\" style=\"width: 100%; background: #FFF9F2; border: 1px solid #E8C9C3; border-radius: 24px; padding: clamp(28px, 6vw, 44px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center\">\n        <svg width=\"34\" height=\"31\" sc-camel-view-box=\"0 0 22 20\" fill=\"#E8C9C3\" stroke=\"#9E5B48\" stroke-width=\".9\" aria-hidden=\"true\"><path d=\"M11 18 C3 12 1 8 1 5.5 C1 2.8 3.2 1 5.6 1 C8 1 10 2.6 11 4.6 C12 2.6 14 1 16.4 1 C18.8 1 21 2.8 21 5.5 C21 8 19 12 11 18Z\"><\u002Fpath><\u002Fsvg>\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 30px\">{{thanksTitle}}<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #76594D\">{{thanksBody}}<\u002Fp>\n        <a href=\"{{waUrl}}\" target=\"_blank\" rel=\"noopener\" class=\"btn\" style=\"margin-top: 6px\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z\"><\u002Fpath><path d=\"M9 9.5c.3 2 2.5 4.3 4.8 4.8\"><\u002Fpath><\u002Fsvg>\n          Send on WhatsApp\n        <\u002Fa>\n        <p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.65; color: #41352F; background: #F5EBDD; border-radius: 12px; padding: 12px 16px\">Your RSVP reaches us only once you tap send in WhatsApp.<\u002Fp>\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{editReply}}\">Edit my reply<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 8. THE CLOSING NOTE ============ -->\n<footer class=\"wc-host\" style=\"padding: clamp(80px, 12vw, 128px) 20px 56px\">\n  <div class=\"reveal\" style=\"max-width: 520px; margin: 0 auto; position: relative; border: 1px solid #E8C9C3; border-radius: 22px; padding: 10px; background: #FFF9F2\">\n    <svg width=\"74\" height=\"98\" sc-camel-view-box=\"0 0 120 160\" fill=\"none\" stroke=\"#BD7965\" stroke-width=\"1.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position: absolute; left: -18px; top: -30px\">\n      <path d=\"M60 158 C58 120 62 90 60 50\"><\u002Fpath><path d=\"M60 120 C45 112 36 100 34 86 C48 90 57 102 60 120Z\" fill=\"#B9C5AE\" fill-opacity=\".5\"><\u002Fpath><path d=\"M60 100 C74 94 84 82 86 68 C72 72 62 84 60 100Z\" fill=\"#B9C5AE\" fill-opacity=\".5\"><\u002Fpath><circle cx=\"60\" cy=\"38\" r=\"5\"><\u002Fcircle><path d=\"M60 33 C52 18 40 16 36 26 C34 34 46 40 55 37\"><\u002Fpath><path d=\"M65 37 C74 40 86 34 84 26 C80 16 68 18 60 33\"><\u002Fpath><path d=\"M56 43 C46 50 44 62 52 64 C58 64 60 54 58 44\"><\u002Fpath><path d=\"M62 44 C60 54 62 64 68 64 C76 62 74 50 64 43\"><\u002Fpath>\n    <\u002Fsvg>\n    <svg width=\"74\" height=\"98\" sc-camel-view-box=\"0 0 120 160\" fill=\"none\" stroke=\"#BD7965\" stroke-width=\"1.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position: absolute; right: -18px; bottom: -30px; transform: rotate(180deg)\">\n      <path d=\"M60 158 C58 120 62 90 60 50\"><\u002Fpath><path d=\"M60 120 C45 112 36 100 34 86 C48 90 57 102 60 120Z\" fill=\"#E8C9C3\" fill-opacity=\".6\"><\u002Fpath><path d=\"M60 100 C74 94 84 82 86 68 C72 72 62 84 60 100Z\" fill=\"#E8C9C3\" fill-opacity=\".6\"><\u002Fpath><circle cx=\"60\" cy=\"38\" r=\"5\"><\u002Fcircle><path d=\"M60 33 C52 18 40 16 36 26 C34 34 46 40 55 37\"><\u002Fpath><path d=\"M65 37 C74 40 86 34 84 26 C80 16 68 18 60 33\"><\u002Fpath><path d=\"M56 43 C46 50 44 62 52 64 C58 64 60 54 58 44\"><\u002Fpath><path d=\"M62 44 C60 54 62 64 68 64 C76 62 74 50 64 43\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"border: 1px dashed #BD7965; border-radius: 16px; padding: 56px clamp(20px, 6vw, 40px); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center\">\n      <p style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-size: clamp(22px, 5vw, 27px); line-height: 1.5\">Two hearts. Two families.<br>One beautiful beginning.<\u002Fp>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: #76594D\">We would love to have you with us as we begin our forever.<\u002Fp>\n      <svg class=\"float-heart\" width=\"26\" height=\"24\" sc-camel-view-box=\"0 0 22 20\" fill=\"#E8C9C3\" stroke=\"#9E5B48\" stroke-width=\".9\" aria-hidden=\"true\"><path d=\"M11 18 C3 12 1 8 1 5.5 C1 2.8 3.2 1 5.6 1 C8 1 10 2.6 11 4.6 C12 2.6 14 1 16.4 1 C18.8 1 21 2.8 21 5.5 C21 8 19 12 11 18Z\"><\u002Fpath><\u002Fsvg>\n      <p style=\"margin: 0; font-family: 'Pinyon Script', cursive; font-size: clamp(44px, 11vw, 60px); line-height: 1.15; color: #9E5B48\">{{c.groom}} &amp; {{c.bride}}<\u002Fp>\n      <p style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; letter-spacing: .3em\">{{c.dateShort}}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 56px 0 0; text-align: center; font-family: 'Caveat', cursive; font-size: 20px; color: #76594D\">made with love, for the people we love<\u002Fp>\n  <p style=\"margin: 8px 0 0; text-align: center\"><a href=\"#top\" class=\"navlink\">Back to top ↑<\u002Fa><\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDraftEvents&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Content&quot;},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Preview&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:6400}}\">\nclass Component extends DCLogic {\n\n  /* ==========================================================\n     WEDDING CONFIGURATION — edit everything personal here.\n     Anything still in [SQUARE BRACKETS] is a placeholder.\n     ========================================================== */\n  config() {\n    return {\n      groom: 'Vivek',\n      bride: 'Apoorva',\n      // Ceremony start, with India's UTC offset — drives the countdown\n      weddingISO: '2027-01-24T09:00:00+05:30',\n      day: 'Sunday',\n      dateText: '24 January 2027',\n      dateShort: '24 · 01 · 2027',\n      time: '9:00 AM onwards',\n      venueName: '[VENUE NAME]',\n      venueAddress: '[FULL VENUE ADDRESS, CITY, PIN CODE]',\n      // Paste the venue's Google Maps share link here; until then it searches the venue name + address\n      mapsLink: '',\n      rsvpBy: '[RSVP-BY DATE]',\n      groomParents: 'Rita Srivastava & Late Birendra Srivastava',\n      brideParents: 'Anju Jain & Sanjay Jain',\n      familyNames: '[GRANDPARENTS & FAMILY NAMES]',\n      // RSVP via WhatsApp: the number replies go to, with country code, digits only\n      // e.g. '919812345678'. While empty, WhatsApp asks the guest to pick a contact.\n      rsvpWhatsApp: '919546357636',\n      // \"Our Moments\" slides — paste each photo's link into src (upload to the canvas first).\n      // Empty src = a placeholder frame. Add or remove slides freely.\n      photos: [\n        { src: '', caption: 'where it all began' },\n        { src: '', caption: 'us, being us' },\n        { src: '', caption: 'our favourite kind of day' },\n        { src: '', caption: 'two families, one love' },\n        { src: '', caption: 'and now… forever' }\n      ],\n      // Celebrations — set draft:false once an event's details are final.\n      // Draft events can be hidden with the \"Show draft events\" tweak.\n      events: [\n        { name: 'Wedding Ceremony', date: 'Sunday, 24 January 2027', time: '9:00 AM onwards', venue: '[VENUE NAME]', note: 'the moment we have been waiting for', mapsUrl: '', draft: false },\n        { name: 'Reception', date: 'Sunday, 24 January 2027', time: '7:00 PM onwards', venue: 'Vintage Banquet, CP-5, Sector 9, Vasundhara, Ghaziabad, Uttar Pradesh 201012', note: 'come hungry, leave dancing — and if Tom & Jerry plays, you know what to do', mapsUrl: 'https://www.google.com/maps/search/?api=1&query=Vintage+Banquet+CP-5+Sector+9+Vasundhara+Ghaziabad+201012', draft: false }\n      ]\n    };\n  }\n\n  constructor(props) {\n    super(props);\n    this.state = {\n      stage: 'sealed',\n      now: Date.now(),\n      form: { name: '', attend: '', guests: '1', message: '' },\n      errors: {},\n      submitted: false,\n      slide: 0\n    };\n  }\n\n  componentDidMount() {\n    this.tick = setInterval(() => this.setState({ now: Date.now() }), 30000);\n    let reduce = false;\n    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}\n    if (!reduce) {\n      this.autoplay = setInterval(() => { if (!this.userNav) this.go(this.state.slide + 1); }, 4500);\n    }\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.tick);\n    clearInterval(this.autoplay);\n    clearTimeout(this.openTimer);\n  }\n\n  go(i, byUser) {\n    const total = this.config().photos.length;\n    if (byUser) this.userNav = true;\n    this.setState({ slide: ((i % total) + total) % total });\n  }\n\n  openInvite() {\n    let reduce = false;\n    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}\n    if (reduce) { this.setState({ stage: 'open' }); return; }\n    if (this.state.stage !== 'sealed') return;\n    this.setState({ stage: 'opening' });\n    // seal fades → both doors swing open → card settles forward → doors removed\n    this.openTimer = setTimeout(() => this.setState({ stage: 'open' }), 2300);\n  }\n\n  setField(key, value) {\n    const form = Object.assign({}, this.state.form, { [key]: value });\n    const errors = Object.assign({}, this.state.errors, { [key]: '' });\n    this.setState({ form, errors });\n  }\n\n  submit(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    const f = this.state.form;\n    const errors = {};\n    if (f.name.trim().length < 2) errors.name = 'Please tell us your name.';\n    if (!f.attend) errors.attend = 'Please let us know if you can make it.';\n    if (errors.name || errors.attend) { this.setState({ errors }); return; }\n    // The reply is sent by the guest from WhatsApp (see waUrl in renderVals).\n    this.setState({ submitted: true, errors: {} });\n  }\n\n  renderVals() {\n    const c = this.config();\n    const stage = this.props.startOpen ? 'open' : this.state.stage;\n    const f = this.state.form;\n\n    const target = new Date(c.weddingISO).getTime();\n    let diff = Math.max(0, target - this.state.now);\n    const days = Math.floor(diff / 86400000); diff -= days * 86400000;\n    const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;\n    const mins = Math.floor(diff / 60000);\n    const past = target <= this.state.now;\n\n    const showDraft = this.props.showDraftEvents ?? true;\n    const events = c.events\n      .filter((ev) => showDraft || !ev.draft)\n      .map((ev) => Object.assign({}, ev, { isDraft: !!ev.draft }));\n\n    const mapsUrl = c.mapsLink ||\n      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.venueName + ', ' + c.venueAddress);\n\n    const first = f.name.trim().split(' ')[0];\n    const coming = f.attend === 'yes';\n    const n = parseInt(f.guests, 10) || 1;\n\n    const tones = ['#EBD3CF', '#DCE3D3', '#F3E0C8', '#E8C9C3', '#E4E8DA'];\n    const slide = this.state.slide;\n    const slides = c.photos.map((p, i) => ({\n      src: p.src, empty: !p.src, caption: p.caption, n: i + 1,\n      bg: tones[i % tones.length], rot: i % 2 ? '1.6deg' : '-1.6deg'\n    }));\n    const dots = slides.map((s, i) => ({\n      label: 'Show photo ' + (i + 1),\n      go: () => this.go(i, true),\n      dotStyle: i === slide ? 'width: 22px; background: #9E5B48' : 'width: 8px; background: #D8C3B4'\n    }));\n\n    return {\n      c,\n      slides,\n      dots,\n      trackX: '-' + (slide * 100) + '%',\n      prevSlide: () => this.go(slide - 1, true),\n      nextSlide: () => this.go(slide + 1, true),\n      touchStart: (e) => { this.touchX = e.touches && e.touches[0] ? e.touches[0].clientX : null; },\n      touchEnd: (e) => {\n        const t = e.changedTouches && e.changedTouches[0];\n        if (this.touchX == null || !t) return;\n        const dx = t.clientX - this.touchX;\n        if (Math.abs(dx) > 40) this.go(slide + (dx < 0 ? 1 : -1), true);\n        this.touchX = null;\n      },\n      notOpen: stage !== 'open',\n      isOpen: stage === 'open',\n      gateClass: stage === 'open' ? 'is-open' : (stage === 'opening' ? 'is-opening' : 'is-sealed'),\n      gateLine: stage === 'sealed' ? 'a little something, just for you' : ' ',\n      openInvite: () => this.openInvite(),\n      cd: { days: String(days), hours: String(hours).padStart(2, '0'), mins: String(mins).padStart(2, '0') },\n      countLabel: past ? 'and so our forever began ♡' : 'counting down to our forever',\n      events,\n      mapsUrl,\n      form: f,\n      errors: this.state.errors,\n      attYes: f.attend === 'yes',\n      attNo: f.attend === 'no',\n      onName: (e) => this.setField('name', e.target.value),\n      onAttend: (e) => this.setField('attend', e.target.value),\n      onGuests: (e) => this.setField('guests', e.target.value),\n      onMessage: (e) => this.setField('message', e.target.value),\n      submit: (e) => this.submit(e),\n      notSubmitted: !this.state.submitted,\n      submitted: this.state.submitted,\n      editReply: () => this.setState({ submitted: false }),\n      thanksTitle: 'One last step, ' + first + '!',\n      thanksBody: coming\n        ? 'Tap below to send us your RSVP for ' + n + (n === 1 ? ' guest' : ' guests') + ' — we can’t wait to celebrate with you.'\n        : 'Tap below to let us know on WhatsApp. You will be in our hearts on the day.',\n      waUrl: 'https://wa.me/' + String(c.rsvpWhatsApp || '').replace(/\\D/g, '') + '?text=' + encodeURIComponent(\n        'Hi ' + c.groom + ' & ' + c.bride + '! RSVP for your wedding (' + c.dateText + ')\\n' +\n        'Name: ' + f.name.trim() + '\\n' +\n        'Attending: ' + (coming ? 'Yes, joyfully!' : 'Sorry, can’t make it') + '\\n' +\n        (coming ? 'Guests: ' + n + '\\n' : '') +\n        (f.message.trim() ? 'Note: ' + f.message.trim() : '')\n      )\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
